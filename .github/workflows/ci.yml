name: Iris Classifier CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Sanity check model load and prediction
      run: |
        python -c "
        import joblib
        import numpy as np
        model = joblib.load('iris_classifier.pkl')
        test_input = np.array([[5.1, 3.5, 1.4, 0.2]])
        pred = model.predict(test_input)
        print('Test prediction:', pred)
        "